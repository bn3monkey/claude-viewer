name: Release

# v* 태그를 올리면 Windows exe 와 macOS 앱을 빌드해 GitHub Release 에 붙인다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          npx tauri build --no-bundle
          mkdir out
          cp src-tauri/target/release/claude_viewer.exe "out/claude_viewer-${GITHUB_REF_NAME}-windows-x64.exe"

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # 저장소 설정은 인스톨러를 만들지 않지만 macOS 는 .app 이 있어야 더블클릭으로 연다.
          npx tauri build --target universal-apple-darwin --bundles app --config '{"bundle":{"active":true}}'
          mkdir out
          ditto -c -k --keepParent "src-tauri/target/universal-apple-darwin/release/bundle/macos/Claude Viewer.app" \
            "out/claude_viewer-${GITHUB_REF_NAME}-macos-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            - Windows: `claude_viewer-*-windows-x64.exe` 하나만 받아 실행 (WebView2 런타임 필요)
            - macOS: zip 을 풀어 `Claude Viewer.app` 을 응용 프로그램으로 옮긴다. 서명하지 않았으므로 처음 한 번은 `xattr -cr "/Applications/Claude Viewer.app"` 후 실행
